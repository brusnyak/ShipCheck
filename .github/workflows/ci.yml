name: ShipCheck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipcheck
          POSTGRES_PASSWORD: shipcheck_ci_password
          POSTGRES_DB: shipcheck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Generate Prisma client and push schema
        env:
          DATABASE_URL: postgresql://shipcheck:shipcheck_ci_password@localhost:5432/shipcheck_ci?schema=public
        run: |
          npm run prisma:generate
          npm run prisma:push

      - name: Run Vitest unit & integration suite
        env:
          NODE_ENV: test
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

      - name: Install Playwright Chromium for E2E
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        env:
          ALLOW_LOCAL_SCANS: "true"
          ENABLE_DEMO_FIXTURE: "true"
        run: npm run test:e2e

      - name: Verify Docker backend build
        run: docker build -f Dockerfile.backend -t shipcheck-backend:ci .
