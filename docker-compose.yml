services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipcheck
      POSTGRES_PASSWORD: shipcheck_dev_password
      POSTGRES_DB: shipcheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipcheck -d shipcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://shipcheck:shipcheck_dev_password@postgres:5432/shipcheck?schema=public
      ALLOW_LOCAL_SCANS: "false"
      ENABLE_DEMO_FIXTURE: "true"
      MAX_CONCURRENT_SCANS: "1"
      MAX_PAGES_PER_SCAN: "4"
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    mem_limit: 512m

  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  pgdata:
